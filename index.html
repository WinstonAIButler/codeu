<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CodeU</title>
<meta name="description" content="An online campus for software engineering and AI integration." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

<style>
  /* ============ TOKENS ============ */
  :root {
    /* Institutional / Ivy-league palette: crimson on warm white, near-black ink */
    --paper:      #f2efe9;
    --surface:    #ffffff;
    --surface-2:  #ece8e0;
    --ink:        #1b1a18;
    --ink-soft:   #514e48;
    --ink-faint:  #857f77;
    --rule:       #d2cdc3;
    --rule-soft:  #e5e1d8;
    --ivy:        #8a1a2b;   /* deep crimson — primary fills */
    --ivy-bright: #a51c30;   /* Harvard-crimson — links & accents */
    --gold:       #5c574c;   /* muted secondary mark */
    --danger:     #8a2b1f;

    --font-display: "Spectral", Georgia, "Times New Roman", serif;
    --font-body:    "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --step--2: 0.6875rem;
    --step--1: 0.8125rem;
    --step-0:  1rem;
    --step-1:  1.1875rem;
    --step-2:  1.5rem;
    --step-3:  2rem;
    --step-4:  2.75rem;

    --measure: 66ch;
    --shell-nav: 268px;
    --radius: 4px;
    --shadow: 0 1px 2px rgba(31,33,24,.06), 0 8px 24px -12px rgba(31,33,24,.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #16151a;
      --surface:    #201f26;
      --surface-2:  #2a2932;
      --ink:        #ecebe6;
      --ink-soft:   #aba8a1;
      --ink-faint:  #79766f;
      --rule:       #39373f;
      --rule-soft:  #2b2a32;
      --ivy:        #c23142;
      --ivy-bright: #ed8a95;
      --gold:       #a29e94;
      --danger:     #d9836f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --paper:      #16151a;
    --surface:    #201f26;
    --surface-2:  #2a2932;
    --ink:        #ecebe6;
    --ink-soft:   #aba8a1;
    --ink-faint:  #79766f;
    --rule:       #39373f;
    --rule-soft:  #2b2a32;
    --ivy:        #c23142;
    --ivy-bright: #ed8a95;
    --gold:       #a29e94;
    --danger:     #d9836f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  /* ============ BASE ============ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--step-0);
    line-height: 1.62;
    font-feature-settings: "kern";
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.14; margin: 0; text-wrap: balance; font-weight: 600; }
  p { margin: 0; }
  a { color: var(--ivy-bright); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--ink); }
  button { font: inherit; color: inherit; }
  ::selection { background: var(--ivy); color: var(--surface); }

  :focus-visible { outline: 2px solid var(--ivy-bright); outline-offset: 2px; border-radius: 2px; }

  .mono { font-family: var(--font-mono); }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: var(--step--2);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
  }

  .skip {
    position: absolute; left: -999px; top: 0; z-index: 100;
    background: var(--ivy); color: var(--surface); padding: 10px 16px; border-radius: var(--radius);
  }
  .skip:focus { left: 12px; top: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  /* ============ SITE SHELL — university masthead + top nav ============ */
  .site { min-height: 100vh; display: flex; flex-direction: column; }

  /* thin utility strip, à la harvard.edu / mit.edu */
  .utility {
    background: var(--ink); color: var(--surface);
    font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: .1em; text-transform: uppercase;
  }
  .utility-inner {
    max-width: 1200px; margin: 0 auto; padding: 6px clamp(16px, 4vw, 48px);
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .utility a { color: var(--surface); text-decoration: none; opacity: .82; }
  .utility a:hover { opacity: 1; }

  .site-head {
    background: var(--surface);
    border-bottom: 3px solid var(--ivy);
    position: sticky; top: 0; z-index: 40;
  }
  .site-head-inner {
    max-width: 1200px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 48px);
    display: flex; align-items: center; gap: 20px 32px; flex-wrap: wrap;
  }
  .main { flex: 1; }
  .main-inner { padding: 52px clamp(20px, 5vw, 56px) 100px; max-width: 1100px; margin: 0 auto; }

  /* ---- brand / seal ---- */
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); margin-right: auto; }
  .brand:hover { color: var(--ink); }
  .seal { flex: none; width: 42px; height: 42px; }
  .seal circle, .seal path { vector-effect: non-scaling-stroke; }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .005em; line-height: 1; }
  .brand-sub { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: .22em; color: var(--ink-faint); text-transform: uppercase; margin-top: 3px; }

  /* ---- horizontal primary nav ---- */
  .topnav { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; }
  .topnav a {
    text-decoration: none; color: var(--ink-soft);
    font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: .1em; text-transform: uppercase;
    padding: 8px 11px; border-bottom: 2px solid transparent;
    transition: color .12s ease, border-color .12s ease;
  }
  .topnav a:hover { color: var(--ivy-bright); }
  .topnav a[aria-current="page"] { color: var(--ivy-bright); border-bottom-color: var(--ivy-bright); }

  .theme-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; border: 1px solid var(--rule); border-radius: 999px;
    padding: 5px 11px; font-size: var(--step--2); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-soft); cursor: pointer;
    transition: border-color .12s ease, color .12s ease;
  }
  .theme-toggle:hover { border-color: var(--ink-faint); color: var(--ink); }

  @media (max-width: 860px) {
    .site-head-inner { gap: 12px 20px; }
    .topnav { width: 100%; order: 3; }
    .utility-inner .u-hide { display: none; }
  }

  /* ============ COMPONENTS ============ */
  .breadcrumb { font-family: var(--font-mono); font-size: var(--step--1); color: var(--ink-faint); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .breadcrumb a { color: var(--ink-soft); text-decoration: none; }
  .breadcrumb a:hover { color: var(--ivy-bright); }
  .breadcrumb span[aria-hidden] { opacity: .5; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: .06em;
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule);
    color: var(--ink-soft); text-transform: uppercase; white-space: nowrap;
  }
  .pill.ivy { border-color: color-mix(in srgb, var(--ivy) 45%, transparent); color: var(--ivy-bright); }
  .pill.gold { border-color: color-mix(in srgb, var(--gold) 45%, transparent); color: var(--gold); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px; border-radius: var(--radius); border: 1px solid transparent;
    font-weight: 600; font-size: var(--step--1); cursor: pointer; text-decoration: none;
    transition: background .14s ease, border-color .14s ease, color .14s ease, transform .05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--ivy); color: var(--surface); }
  .btn-primary:hover { background: var(--ink); color: var(--surface); }
  .btn-ghost { background: transparent; border-color: var(--rule); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--ink-faint); color: var(--ink); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn[disabled]:active { transform: none; }

  .ring {
    --p: 0;
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    background: conic-gradient(var(--ivy) calc(var(--p) * 1%), var(--rule) 0);
    display: grid; place-items: center;
  }
  .ring::after {
    content: ""; width: 34px; height: 34px; border-radius: 50%; background: var(--surface);
  }
  .ring span {
    position: absolute; font-family: var(--font-mono); font-size: var(--step--2); font-weight: 600; color: var(--ink-soft);
  }
  .ring-wrap { position: relative; display: grid; place-items: center; }

  .bar { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ivy); border-radius: 999px; }

  .note {
    border: 1px solid var(--rule); border-left: 3px solid var(--gold);
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 16px; font-size: var(--step--1); color: var(--ink-soft); margin: 22px 0;
  }

  /* ============ HOME ============ */
  .masthead {
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    padding-bottom: 30px; border-bottom: 1px solid var(--rule);
  }
  .masthead .seal-lg { width: 68px; height: 68px; }
  .masthead h1 {
    font-size: clamp(2.4rem, 6vw, 3.4rem); font-weight: 700; letter-spacing: -.012em; line-height: 1.05;
    padding-bottom: 12px; border-bottom: 3px solid var(--ivy);
  }
  .masthead .motto { font-family: var(--font-mono); font-size: var(--step--1); letter-spacing: .24em; text-transform: uppercase; color: var(--ivy-bright); }
  .lede {
    font-family: var(--font-display); font-size: clamp(1.15rem, 2.4vw, 1.4rem); font-weight: 400;
    color: var(--ink-soft); max-width: var(--measure); margin: 28px 0 24px; line-height: 1.5;
  }
  .home-cta { display: flex; flex-wrap: wrap; gap: 12px; }

  .section { margin-top: 64px; }
  .section > h2 { font-size: var(--step-2); margin-bottom: 4px; }
  .section > .eyebrow { margin-bottom: 20px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .section-head h2 { font-size: var(--step-2); }
  .section-head a { font-family: var(--font-mono); font-size: var(--step--1); text-decoration: none; }

  .stages { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .stage { background: var(--surface); padding: 18px 20px; display: grid; grid-template-columns: 46px 1fr; gap: 16px; align-items: start; }
  .stage .num { font-family: var(--font-display); font-size: var(--step-2); color: var(--ivy); font-weight: 700; line-height: 1; }
  .stage h3 { font-size: var(--step-1); margin-bottom: 4px; }
  .stage p { font-size: var(--step--1); color: var(--ink-soft); }

  .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .track {
    border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; background: var(--surface);
    display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink);
    transition: border-color .14s ease, transform .06s ease;
  }
  .track:hover { border-color: var(--ivy); color: var(--ink); transform: translateY(-2px); }
  .track h3 { font-size: var(--step-1); }
  .track p { font-size: var(--step--1); color: var(--ink-soft); flex: 1; }
  .track .meta { font-family: var(--font-mono); font-size: var(--step--2); color: var(--ink-faint); letter-spacing: .06em; }

  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 22px 32px; }
  .how div h3 { font-size: var(--step-0); font-family: var(--font-body); font-weight: 700; margin-bottom: 4px; }
  .how div p { font-size: var(--step--1); color: var(--ink-soft); }
  .how div .k { font-family: var(--font-mono); font-size: var(--step--2); color: var(--ivy-bright); letter-spacing: .1em; }

  /* ============ CATALOG ============ */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 26px; }
  .search {
    flex: 1 1 220px; min-width: 200px; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 12px; background: var(--surface);
  }
  .search input { border: none; background: none; outline: none; flex: 1; color: var(--ink); font-size: var(--step--1); }
  .chip {
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 12px; font-size: var(--step--1); cursor: pointer;
    font-family: var(--font-mono); letter-spacing: .04em; transition: all .12s ease;
  }
  .chip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ivy); border-color: var(--ivy); color: var(--surface); }

  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 16px; }
  .course-card {
    border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface);
    padding: 20px; display: flex; flex-direction: column; gap: 12px; min-height: 210px;
    transition: border-color .14s ease, transform .06s ease, box-shadow .14s ease;
  }
  .course-card:hover { border-color: var(--ivy); transform: translateY(-2px); box-shadow: var(--shadow); }
  .course-card .code { font-family: var(--font-mono); font-size: var(--step--1); color: var(--ivy-bright); letter-spacing: .06em; font-weight: 500; }
  .course-card h3 { font-size: var(--step-1); }
  .course-card p { font-size: var(--step--1); color: var(--ink-soft); flex: 1; }
  .course-card .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--rule-soft); }
  .course-card .facts { display: flex; gap: 10px; font-family: var(--font-mono); font-size: var(--step--2); color: var(--ink-faint); }
  .card-link { text-decoration: none; color: inherit; }
  .card-link:hover { color: inherit; }
  .enrolled-flag { font-family: var(--font-mono); font-size: var(--step--2); color: var(--ivy-bright); letter-spacing: .06em; }

  .empty { border: 1px dashed var(--rule); border-radius: var(--radius); padding: 40px; text-align: center; color: var(--ink-faint); font-family: var(--font-mono); font-size: var(--step--1); }

  /* ============ COURSE PAGE ============ */
  .course-head { border-bottom: 2px solid var(--ink); padding-bottom: 26px; margin-bottom: 8px; }
  .course-head .code { font-family: var(--font-mono); color: var(--ivy-bright); letter-spacing: .08em; font-size: var(--step--1); }
  .course-head h1 { font-size: var(--step-3); margin: 8px 0 12px; }
  .course-head .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .course-head .desc { font-size: var(--step-1); color: var(--ink-soft); max-width: var(--measure); line-height: 1.5; }
  .course-meta { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 18px; font-size: var(--step--1); color: var(--ink-soft); }
  .course-meta b { font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); display: block; margin-bottom: 2px; font-weight: 600; }
  .enroll-row { display: flex; align-items: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
  .enroll-status { display: flex; align-items: center; gap: 12px; }
  .enroll-status .txt { font-size: var(--step--1); color: var(--ink-soft); }
  .enroll-status .txt b { color: var(--ink); font-family: var(--font-body); }

  .subsection { margin-top: 52px; }
  .subsection > h2 { font-size: var(--step-2); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .outcomes { columns: 2; column-gap: 40px; }
  .outcomes li { margin-bottom: 10px; font-size: var(--step--1); color: var(--ink-soft); break-inside: avoid; }

  table.grades { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
  table.grades th, table.grades td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--rule-soft); }
  table.grades th { font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  table.grades td.n { font-family: var(--font-mono); text-align: right; color: var(--ink); }
  table.grades tr:last-child td { border-bottom: none; font-weight: 600; }

  .unit { border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: 12px; background: var(--surface); overflow: hidden; }
  .unit > summary {
    list-style: none; cursor: pointer; padding: 16px 18px; display: grid;
    grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center;
  }
  .unit > summary::-webkit-details-marker { display: none; }
  .unit > summary:hover { background: var(--surface-2); }
  .unit .u-label { font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .unit .u-title { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; }
  .unit .u-weeks { font-family: var(--font-mono); font-size: var(--step--2); color: var(--ink-faint); grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .unit .u-sum { grid-column: 1 / -1; font-size: var(--step--1); color: var(--ink-soft); margin-top: 4px; }
  .unit .u-prog { grid-column: 1 / -1; margin-top: 12px; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: var(--step--2); color: var(--ink-faint); }
  .unit .u-prog .bar { flex: 1; max-width: 200px; }
  .lessons-list { border-top: 1px solid var(--rule); }
  .lrow {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 18px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule-soft);
    transition: background .12s ease;
  }
  .lrow:last-child { border-bottom: none; }
  .lrow:hover { background: var(--surface-2); color: var(--ink); }
  .lrow .licon { color: var(--ink-faint); display: grid; place-items: center; }
  .lrow.done .licon { color: var(--ivy); }
  .lrow .lt { font-size: var(--step--1); font-weight: 500; }
  .lrow .lt small { display: block; font-weight: 400; color: var(--ink-faint); font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: .04em; margin-top: 1px; }
  .lrow .lmeta { font-family: var(--font-mono); font-size: var(--step--2); color: var(--ink-faint); white-space: nowrap; }

  .project-box { border: 1px solid var(--ivy); border-radius: var(--radius); padding: 22px; background: color-mix(in srgb, var(--ivy) 6%, var(--surface)); }
  .project-box .eyebrow { color: var(--ivy-bright); }
  .project-box h3 { font-size: var(--step-1); margin: 6px 0 8px; }
  .project-box p { font-size: var(--step--1); color: var(--ink-soft); max-width: var(--measure); }

  /* ============ LESSON PAGE ============ */
  .lesson-head { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
  .lesson-head h1 { font-size: var(--step-3); margin: 10px 0 12px; }
  .lesson-head .lmeta { font-family: var(--font-mono); font-size: var(--step--1); color: var(--ink-faint); display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson-body { max-width: var(--measure); }
  .lesson-body > * + * { margin-top: 18px; }
  .lesson-body h3 { font-size: var(--step-1); margin-top: 34px; }
  .lesson-body p { color: var(--ink); }
  .lesson-body .lead { font-size: var(--step-1); color: var(--ink-soft); line-height: 1.5; }
  .lesson-body ul, .lesson-body ol { margin: 0; padding-left: 22px; color: var(--ink); }
  .lesson-body li { margin-bottom: 8px; }
  .lesson-body code { font-family: var(--font-mono); font-size: .875em; background: var(--surface-2); padding: 2px 5px; border-radius: 3px; }
  .lesson-body pre {
    font-family: var(--font-mono); font-size: var(--step--1); line-height: 1.55;
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 16px; overflow-x: auto;
  }

    units: [
      { n: "HTTP and REST", weeks: "Weeks 1–2",
        sum: "The protocol every web API speaks, and a discipline for shaping resources.",
        lessons: [
          L("The request/response cycle", "reading", 24,
            "Methods, status codes, headers, and body — and what 'idempotent' and 'safe' mean for each method.",
            ["Map CRUD operations to methods and status codes", "Explain why POST is not idempotent and PUT is"],
            `<p class="lead">An HTTP API is a contract: a client sends a request shaped a certain way, and your server promises a response shaped a certain way. The whole craft is making that contract predictable.</p>
<h3>Methods carry meaning</h3>
<ul>
<li><code>GET</code> — read, no side effects. Safe to retry, cache, prefetch.</li>
<li><code>POST</code> — create or trigger. Not idempotent: two identical POSTs make two things.</li>
<li><code>PUT</code> — replace at a known URL. Idempotent: same request twice = same state.</li>
<li><code>PATCH</code> — partial update.</li>
<li><code>DELETE</code> — remove. Idempotent: deleting twice ends in the same state.</li>
</ul>
<h3>Status codes are not decoration</h3>
<pre><code>200 OK              request succeeded, body has the result
201 Created         new resource made; Location header points to it
204 No Content      succeeded, nothing to return
400 Bad Request     the client sent something invalid
401 Unauthorized    no valid credentials
403 Forbidden       valid credentials, not allowed
404 Not Found       no such resource
409 Conflict        request collides with current state
422 Unprocessable   well-formed but semantically wrong
500 Internal Error  your bug, not theirs</code></pre>
<p>Clients build retry logic, alerting, and caching on these numbers. Returning <code>200</code> with <code>{"error": "..."}</code> in the body breaks every one of those.</p>`),

    instructor: "Prof. Sofia Andersson", prereqs: ["AI 210", "CS 230"],
    desc: "The core applied course. Treat a large language model as a component in a system: call it well, constrain its output, handle its failures, and measure whether it is helping.",

    grading: [["Prompting labs", 25], ["LLM feature project", 35], ["Evaluation project", 25], ["Final: model + prompt bake-off", 15]],
    project: { t: "A support-ticket triage feature", d: "Build a function that takes a raw customer message and returns a validated JSON object — category, urgency, suggested reply, and a 'needs human' flag — with an eval set of 60 labeled tickets and a report comparing two prompts and two models on accuracy, cost, and latency." },
    units: [
      { n: "How a language model behaves", weeks: "Weeks 1–2",
        sum: "Before prompting well, understand what you are prompting: a next-token predictor with a fixed context window.",
        lessons: [
          L("Tokens, context, and cost", "reading", 24,
            "What a token is, how the context window bounds everything, and why every design choice shows up on the bill and the latency graph.",
            ["Estimate the token cost of a prompt + response", "Explain why long context is not free"],
            `<p class="lead">A large language model does one thing: given a sequence of tokens, it predicts the next token, then does it again. Every capability you have seen is that loop plus training. If you hold this picture, most "why did it do that?" questions answer themselves.</p>
<h3>Tokens</h3>
<p>Models do not see characters or words — they see <em>tokens</em>, chunks of roughly 4 characters of English. "unbelievable" might be <code>un</code> + <code>bel</code> + <code>iev</code> + <code>able</code>. This matters because:</p>
<ul>
<li>You are billed per token, input and output separately.</li>
<li>Latency grows with tokens generated — a 1,000-token answer takes far longer than a 100-token one.</li>
<li>The <strong>context window</strong> (say 200,000 tokens) is a hard ceiling on prompt + response combined. Exceed it and the oldest content falls out or the call fails.</li>
</ul>
<h3>Temperature</h3>
<p>At each step the model has a probability distribution over next tokens. <code>temperature</code> near 0 makes it almost always take the most likely token — repeatable, good for extraction and classification. Higher temperature samples more adventurously — better for brainstorming, worse for anything you need to test.</p>
<pre><code>classification / extraction / code fixes   → temperature 0–0.2
drafting prose, ideas, variety             → temperature 0.7–1.0</code></pre>
<h3>The consequence</h3>
<p>"Just stuff everything in the prompt" is a real design with real costs: slower responses, higher bills, and more room for the model to lose the thread. Half of prompt engineering is deciding what <em>not</em> to send.</p>`),
          L("Sampling, temperature, and determinism", "reading", 20, "Why the same prompt gives different answers, and how to make outputs testable.", null, null),
          L("Lab: measure a model", "lab", 55, "Send the same task at several temperatures and lengths; chart cost, latency, and variance.", null, null)
        ] },
      { n: "Prompt design", weeks: "Weeks 3–4",
        sum: "A prompt is a spec. Vague specs get vague software.",
        lessons: [
          L("Anatomy of a strong prompt", "reading", 26,
            "Role, task, context, constraints, examples, and an explicit output contract — and the order that works.",
            ["Rewrite a weak prompt into a structured one", "Name what each section of a prompt is doing"],
            `<p class="lead">Treat the model like a capable new hire who is brilliant, literal, has no memory of yesterday, and will confidently guess if you are vague. You would not give that person a one-line task description. Do not give the model one either.</p>
<h3>The sections, in order</h3>
<ol>
<li><strong>Role / context</strong> — who the model is acting as and what situation it is in. "You are triaging support tickets for a payments company."</li>
<li><strong>Task</strong> — the single job, stated as an imperative. "Classify the ticket and draft a reply."</li>
<li><strong>Material</strong> — the actual input, clearly delimited so it cannot be confused with instructions (XML tags or fenced blocks work well).</li>
<li><strong>Constraints</strong> — length, tone, what to never do, how to handle uncertainty.</li>
<li><strong>Examples</strong> — one to three worked cases showing exactly the input→output mapping you want.</li>
<li><strong>Output contract</strong> — the precise shape of the answer. "Return only JSON matching this schema. No prose."</li>
</ol>
<h3>Why order matters</h3>
<p>Put the material near the end, after the instructions, so the model reads the rules before it reads the thing it is applying them to. Put the output contract last so it is the freshest instruction when generation starts.</p>
<pre><code>You are triaging support tickets for a payments company.

Classify the ticket below and draft a one-paragraph reply.
If the issue involves lost money or fraud, set "needs_human": true.

&lt;ticket&gt;
{{ticket_text}}
&lt;/ticket&gt;

Return ONLY JSON: {category, urgency: 1-5, reply, needs_human}</code></pre>`),
          L("Few-shot examples and formatting", "reading", 22, "Choosing examples that cover edge cases, and formatting tricks that steer without more words.", null, null),
          L("Decomposition and chaining", "reading", 22, "When one call cannot do it: splitting into steps, and passing structured state between calls.", ["Break a complex task into a two-call chain with a typed handoff"], null),

        ] },

const LS_KEY = "codeu.v1";
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { enrolled: [], done: {} };
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
let state = loadState();

function loadTheme() {
  try { return localStorage.getItem("codeu.theme"); } catch (e) { return null; }
}
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  const isDark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const icon = document.getElementById("themeIcon");
  const lbl = document.getElementById("themeLbl");
  if (icon) icon.textContent = isDark ? "☀" : "☾";
  if (lbl) lbl.textContent = isDark ? "Light" : "Dark";
}
let theme = loadTheme();
applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click", () => {
  const order = [null, "light", "dark"];
  const cur = theme ?? null;
  theme = order[(order.indexOf(cur) + 1) % 3];
  try { theme ? localStorage.setItem("codeu.theme", theme) : localStorage.removeItem("codeu.theme"); } catch (e) {}
  applyTheme(theme);
});

function lessonId(u, l) { return "u" + (u + 1) + "-l" + (l + 1); }
function flatLessons(course) {
  const out = [];
  (course.units || []).forEach((u, ui) => u.lessons.forEach((les, li) => out.push({ id: lessonId(ui, li), ui, li, unit: u, les })));
  return out;
}
function isEnrolled(course) { return state.enrolled.includes(course.code); }
function doneSet(course) { return new Set(state.done[course.code] || []); }
function courseProgress(course) {
  const total = flatLessons(course).length;
  const d = (state.done[course.code] || []).length;
  return { done: d, total, pct: total ? Math.round((d / total) * 100) : 0 };
}
function toggleEnroll(course) {
  if (isEnrolled(course)) state.enrolled = state.enrolled.filter((c) => c !== course.code);
  else state.enrolled.push(course.code);

}
function toggleDone(course, id) {
  const set = new Set(state.done[course.code] || []);

  saveState();
}

function professorFor(c) {

function composedBody(c, item) {
  const { les, unit } = item;
  const lab = unit.lessons.find((x) => x.type === "lab");
  let h = `<p class="lead">${esc(les.sum)}</p>`;
  if (les.obj && les.obj.length) {
    h += `<h3>By the end of this lesson</h3><ul>${les.obj.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
  }
  h += `<h3>What this unit covers</h3><p>${esc(unit.sum)}</p>`;
  if (lab && lab !== les) {
    h += `<h3>How you'll practice</h3><p>You apply this directly in <strong>${esc(lab.t)}</strong> (${lab.mins} minutes), the hands-on lab for this unit. ${esc(lab.sum)}</p>`;
  } else if (les.type === "lab") {
    h += `<h3>This is a lab</h3><p>Work through it in your editor with the course starter repo. Submissions run against hidden test cases and you get feedback immediately.</p>`;
  }
  h += `<div class="note">This demonstration campus shows every lesson's scope, objectives, and place in the course. Full written lesson notes and starter code are delivered in the course workspace when a cohort is running.</div>`;
  return h;
}

function viewLesson(code, lid) {
  const c = courseBy(code);
  if (!c) return notFound();
  const flat = flatLessons(c);
  const idx = flat.findIndex((x) => x.id === lid);
  if (idx < 0) return notFound();
  const item = flat[idx];
  const { les, unit, ui } = item;
  const done = doneSet(c).has(lid);
  const prev = idx > 0 ? flat[idx - 1] : null;
  const next = idx < flat.length - 1 ? flat[idx + 1] : null;
  const body = les.body || composedBody(c, item);
  const prof = professorFor(c);
  const objLine = les.obj && les.obj.length ? " Objectives: " + les.obj.join("; ") + "." : "";
  const rules =
    `You are ${prof.name}, an AI instructor at CodeU, an online college for software engineering and AI integration. ` +
    `You are holding office hours with a student in "${c.title}" (${c.code}). ` +
    `They are working through Unit ${ui + 1}: ${unit.n} — the lesson "${les.t}". ` +
    `Lesson scope: ${les.sum}${objLine} ` +
    `Your teaching voice: ${prof.voice} ` +
    `Help them understand this material: build intuition first, use a short concrete example or a few lines of code where it helps, and finish by checking their understanding with one quick question. ` +
    `If they ask about something from another part of the program, answer briefly and point them to the relevant CodeU course. ` +
    `Keep replies under about 220 words unless they ask for more depth. ` +
    `You are an AI instructor — say so plainly if asked — and a named human faculty member of record is responsible for grades and academic decisions.`;

  return `
  <div class="breadcrumb">
    <a href="#/catalog">Catalog</a> <span aria-hidden="true">/</span>
    <a href="#/course/${c.slug}">${esc(c.code)}</a> <span aria-hidden="true">/</span>
    Unit ${ui + 1} <span aria-hidden="true">/</span> ${esc(les.t)}
  </div>

  <div class="lesson-head">
    <p class="eyebrow">Unit ${ui + 1} · ${esc(unit.n)}</p>
    <h1>${esc(les.t)}</h1>
    <p class="lmeta"><span>${esc(les.type)}</span><span aria-hidden="true">·</span><span>${les.mins} min</span><span aria-hidden="true">·</span><span>${esc(c.title)}</span></p>
    <div class="prof-byline"><span class="avatar sm">${esc(prof.av)}</span><span><span class="n">${esc(prof.name)}</span> <span class="r">· ${esc(prof.domain)} · AI instructor</span></span></div>
  </div>

  <div class="lesson-body">${body}</div>

  <section class="office" id="office" data-key="${esc(c.slug + ":" + lid)}" data-prof="${esc(prof.name)}" data-rules="${esc(rules)}">
    <div class="oh-hd"><span class="avatar sm">${esc(prof.av)}</span><h3>Office hours with ${esc(prof.name)}</h3></div>
    <p class="oh-sub">Ask anything about this lesson. ${esc(prof.name)} is your AI instructor for ${esc(c.title)}; a human faculty member of record grades your work.</p>
    <div class="oh-log" id="ohLog"></div>

  const totalCeu = Math.round(courses.reduce((s, c) => s + ceuFor(c), 0) * 10) / 10;
  const first = courses[0];

  const rows = courses.map((c) => `<tr>
      <td class="code"><a href="#/course/${c.slug}">${esc(c.code)}</a></td>
      <td>${esc(c.title)}</td>
      <td class="cr">${c.credits}</td>
      <td class="cr">${ceuFor(c)}</td>
      <td class="cr">${usd(c.credits * (c.level >= 500 ? TUITION.gradPerCredit : TUITION.ugPerCredit))}</td>
    </tr>`).join("");

  return `
  ${complianceRibbon()}
  <div class="breadcrumb"><a href="#/">Campus</a> <span aria-hidden="true">/</span> <a href="#/certificates">Certificates</a> <span aria-hidden="true">/</span> ${esc(ct.title)}</div>

      <span class="pill">${certCredits(ct)} credits</span>
      <span class="pill">${totalCeu} CEUs</span>

    </div>
    <div class="home-cta" style="margin-top:22px">
      ${first ? `<a class="btn btn-primary" href="#/course/${first.slug}">Start with ${esc(first.code)} →</a>` : ""}

      <table class="plan">
        <thead><tr><th>Course</th><th>Title</th><th class="cr">Cr</th><th class="cr">CEU</th><th class="cr">Tuition</th></tr></thead>

function viewProgram(slug) {
  const pr = programBy(slug);
  if (!pr) return notFound();
  const totalReq = pr.req.reduce((s, r) => s + r.cr, 0);
  const others = PROGRAM_ORDER.filter((s) => s !== slug).map((s) => PROGRAMS[s]);

  const reqSegs = pr.req.map((r) => `<i style="flex:${r.cr}" title="${esc(r.k)}: ${r.cr} cr"></i>`).join("");
  const reqKey = pr.req.map((r, i) => `<span><i style="background:${["var(--ivy)","var(--ivy-bright)","var(--gold)","var(--ink-faint)"][i]}"></i>${esc(r.k)} · ${r.cr}</span>`).join("");

  let running = 0;
  const planRows = pr.plan.map((t) => {
    const termTotal = t.rows.reduce((s, r) => s + r[1], 0);
    running += termTotal;
    const rows = t.rows.map((r) => `<tr>${planRowTitle(r[0])}<td class="cr">${r[1]}</td></tr>`).join("");
    return `<tr class="termhead"><td colspan="3">${esc(t.term)} — ${termTotal} credits</td></tr>${rows}<tr class="sum"><td></td><td>Cumulative</td><td class="cr">${running}</td></tr>`;
  }).join("");

  const soon = pr.status === "coming-soon";
  const feeder = CERTIFICATES.filter((ct) => ct.stacksInto === slug);

  return `
  ${complianceRibbon()}
  <div class="breadcrumb"><a href="#/">Campus</a> <span aria-hidden="true">/</span> <a href="#/degrees">Degrees</a> <span aria-hidden="true">/</span> ${esc(pr.credential.replace(/ \(.*\)/, ""))}</div>

  ${soon ? `<div class="soon-banner">
    <b>${esc(pr.credential.replace(/ \(.*\)/, ""))} — coming soon, not yet enrolling.</b>
    <p>This program is in development. The structure below is a published preview. ${feeder.length ? `You can start now with the <a href="#/certificate/${feeder[0].slug}">${esc(feeder[0].title)}</a> certificate — that credit is designed to stack in.` : `Certificate courses you take now are designed to stack in.`} See <a href="#/accreditation">Accreditation &amp; approvals</a> for the path to launch.</p>
  </div>` : ""}

  <div class="course-head">
    <span class="code">${esc(pr.code)} · ${esc(pr.level)}${soon ? ' · <span class="soon-badge">Coming soon</span>' : ""}</span>
    <h1>${esc(pr.credential)} in ${esc(pr.title)}</h1>
    <div class="pills">
      <span class="pill ivy">${pr.credits} credits</span>
      <span class="pill">${esc(pr.length.split("·")[0].trim())}</span>
      <span class="pill">100% online</span>
      ${soon ? '<span class="pill gold">In development</span>' : ""}
    </div>
    <p class="desc">${esc(pr.outcomes[0])} This plan is built to the general-education and residency structure an accredited ${pr.level.includes("Graduate") ? "master's" : "undergraduate"} degree requires.</p>
    <div class="course-meta">
      <div><b>Planned length</b>${esc(pr.length)}</div>
      <div><b>Delivery</b>${esc(pr.delivery)}</div>
      <div><b>Planned tuition</b>${esc(pr.tuition)}</div>
    </div>
    <div class="home-cta" style="margin-top:22px">
      <a class="btn btn-primary" href="#/certificates">Start with a certificate</a>
      <a class="btn btn-ghost" href="#/catalog">Browse the courses</a>
    </div>
  </div>

  <section class="subsection">
    <h2>Start now — certificates that feed this degree</h2>
    ${feeder.length ? `<div class="prog-grid">${feeder.map(certCard).join("")}</div>` : `<p class="prose">Certificate courses across the catalog stack toward this program's requirements.</p>`}
  </section>

  <section class="subsection">
    <h2>Admission requirements</h2>
    <ul class="prose">${pr.admission.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>
  </section>

  <section class="subsection">
    <h2>Program learning outcomes</h2>
    <p style="color:var(--ink-soft);font-size:var(--step--1);margin-bottom:14px">Graduates of this program will be able to:</p>
    <ol class="outcomes">${pr.outcomes.map((o) => `<li>${esc(o)}</li>`).join("")}</ol>
  </section>

  <section class="subsection">
    <h2>Degree requirements — ${totalReq} credits</h2>
    <div class="reqbar">${reqSegs}</div>
    <div class="reqkey">${reqKey}</div>
    <table class="grades" style="margin-top:18px"><tbody>
      ${pr.req.map((r) => `<tr><td><b style="font-family:var(--font-body)">${esc(r.k)}</b><br/><span style="color:var(--ink-soft);font-size:var(--step--2)">${esc(r.note)}</span></td><td class="n">${r.cr} cr</td></tr>`).join("")}
      <tr><td>Total</td><td class="n">${totalReq} cr</td></tr>
    </tbody></table>
  </section>

  <section class="subsection">
    <h2>Plan of study</h2>
    <p style="color:var(--ink-soft);font-size:var(--step--1);margin-bottom:16px">A recommended term-by-term sequence at roughly ${pr.level.includes("Graduate") ? "6 credits" : "15 credits"} per term. Prerequisites are enforced; an advisor can rebalance the plan for part-time, accelerated, or transfer paths.</p>
    <div style="overflow-x:auto">
      <table class="plan">

    <h2>Academic standards</h2>

      <tr><td>Time limit</td><td>${esc(pr.standards.time)}</td></tr>
    </tbody></table>
    <p style="color:var(--ink-soft);font-size:var(--step--1);margin-top:14px">Satisfactory Academic Progress, credit-for-prior-learning, and the full refund schedule are on the <a href="#/policies">Academic &amp; financial policies</a> page. Careers this program targets: ${pr.careers.map(esc).join(", ")}.</p>

    <h2>The other degrees</h2>
    <div class="prog-grid">${others.map(programCard).join("")}</div>
  </section>

  ${campusFoot()}`;
}

function ckList(items) {
  const label = { inplace: "In place", progress: "In progress", planned: "Planned" };

    <span class="cstat">${label[it.status]}</span>
  </div>`).join("");
}

function parseRoute() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, queryStr] = hash.split("?");
  const params = new URLSearchParams(queryStr || "");
  const segs = path.split("/").filter(Boolean);

  if (segs.length === 0) return { name: "home" };
  if (segs[0] === "catalog") return { name: "catalog", params };
  if (segs[0] === "mycourses") return { name: "mycourses" };
  if (segs[0] === "program" && segs[1]) return { name: "program", slug: segs[1] };
  if (segs[0] === "accreditation") return { name: "accreditation" };
  if (segs[0] === "military") return { name: "military" };
  if (segs[0] === "consumer") return { name: "consumer" };
  if (segs[0] === "policies") return { name: "policies" };
  if (segs[0] === "net-price") return { name: "netprice" };
  if (segs[0] === "faculty") return { name: "faculty" };
  if (segs[0] === "certificates") return { name: "certificates" };
  if (segs[0] === "certificate" && segs[1]) return { name: "certificate", slug: segs[1] };
  if (segs[0] === "degrees") return { name: "degrees" };
  if (segs[0] === "course" && segs[1]) {
    if (segs[2] === "lesson" && segs[3]) return { name: "lesson", code: segs[1], lesson: segs[3] };
    return { name: "course", code: segs[1] };
  }
  return { name: "notfound" };
}

function setupOfficeHours() {
  const el = document.getElementById("office");
  const form = document.getElementById("ohForm");
  const log = document.getElementById("ohLog");
  const input = document.getElementById("ohInput");
  const sendBtn = document.getElementById("ohSend");
  const stopBtn = document.getElementById("ohStop");
  const note = document.getElementById("ohNote");
  if (!el || !form) return;

  const key = el.dataset.key;
  const who = el.dataset.prof;
  const rules = el.dataset.rules;
  if (ASK.key !== key) { ASK.key = key; ASK.turns = []; }
  let busy = false, ctl = null;

  function draw() {
    log.innerHTML = ASK.turns.map((t) => t.role === "user"
      ? `<div class="oh-msg u">${esc(t.content)}</div>`
      : `<div class="oh-msg a"><span class="who">${esc(who)}</span>${esc(t.content)}</div>`).join("");
  }
  draw();

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(160, input.scrollHeight) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  getSample().then((s) => {
    if (!s) {
      note.textContent = "Live office hours open when you view this lesson inside the Claude app or on claude.ai. Offline, work from the lesson objectives above and your cohort channel.";
      input.disabled = true; sendBtn.disabled = true;
      input.placeholder = "Office hours are unavailable in this view";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    const q = input.value.trim();
    if (!q) return;
    const s = await getSample();
    if (!s) return;

    busy = true; sendBtn.disabled = true; stopBtn.hidden = false;
    input.value = ""; input.style.height = "auto";
    ASK.turns.push({ role: "user", content: q });
    ASK.turns.push({ role: "assistant", content: "…" });
    const idx = ASK.turns.length - 1;
    draw();

    ctl = new AbortController();
    stopBtn.onclick = () => ctl.abort();
    const CODE_COPY = {
      not_granted: "Office hours need your permission to use Claude — reload the page and allow it.",
      rate_limited: "That's a lot of questions at once. Give it a minute and ask again.",
      refused: "I can't take that one — try rewording it around the lesson.",
      session_expired: "Please sign in to Claude again to keep going.",
      upstream_error: "Something interrupted that answer. Try again.",
    };
    try {
      const msgs = [{ role: "user", content: rules }, ...ASK.turns.slice(0, -1)];
      const { text } = await s(msgs, {
        cache: false, modelTier: "default", signal: ctl.signal,
        onText: ({ text }) => { ASK.turns[idx].content = text; draw(); },
      });
      ASK.turns[idx].content = text;
    } catch (err) {
      const code = err && err.code;
      const partial = err && err.text ? err.text : "";
      if (code === "cancelled") {
        if (partial) ASK.turns[idx].content = partial + "  —  (stopped)";
        else ASK.turns.splice(idx - 1, 2);
      } else {
        const msg = CODE_COPY[code] || "That didn't go through. Try again in a moment.";
        ASK.turns[idx].content = partial ? partial + "\n\n(" + msg + ")" : msg;
      }
    } finally {
      busy = false; sendBtn.disabled = false; stopBtn.hidden = true;
      draw();
      input.focus();
    }
  });
}

function render() {
  const route = parseRoute();
  const view = document.getElementById("view");
  let html = "";
  switch (route.name) {
    case "home": html = viewHome(); break;
    case "catalog": html = viewCatalog(route.params); break;
    case "mycourses": html = viewMyCourses(); break;
    case "program": html = viewProgram(route.slug); break;
    case "accreditation": html = viewAccreditation(); break;
    case "military": html = viewMilitary(); break;
    case "consumer": html = viewConsumer(); break;
    case "policies": html = viewPolicies(); break;
    case "netprice": html = viewNetPrice(); break;
    case "faculty": html = viewFaculty(); break;
    case "certificates": html = viewCertificates(); break;
    case "certificate": html = viewCertificate(route.slug); break;
    case "degrees": html = viewDegrees(); break;
    case "course": html = viewCourse(route.code); break;
    case "lesson": html = viewLesson(route.code, route.lesson); break;
    default: html = notFound();
  }
  view.innerHTML = html;
  renderNav(route);
  window.scrollTo(0, 0);
  document.getElementById("main").focus?.();

  // wire interactions
  const enrollBtn = document.getElementById("enrollBtn");
  if (enrollBtn) enrollBtn.addEventListener("click", () => { toggleEnroll(courseBy(route.code)); render(); });

  const doneBtn = document.getElementById("doneBtn");
  if (doneBtn) doneBtn.addEventListener("click", () => { toggleDone(courseBy(route.code), route.lesson); render(); });

  if (document.getElementById("ohForm")) setupOfficeHours();

  const search = document.getElementById("catSearch");
  if (search) {
    search.addEventListener("input", (e) => {
      const p = new URLSearchParams(location.hash.split("?")[1] || "");
      e.target.value ? p.set("q", e.target.value) : p.delete("q");
      history.replaceState(null, "", "#/catalog?" + p.toString());
      // re-render grid only
      const route2 = parseRoute();
      const grid = document.querySelector(".course-grid");
      let list = COURSES.slice();
      const at = p.get("track") || "all", al = p.get("level") || "all", q = (p.get("q") || "").toLowerCase();
      if (at !== "all") list = list.filter((c) => c.track === at);
      if (al !== "all") list = list.filter((c) => String(c.level) === al);
      if (q) list = list.filter((c) => (c.title + " " + c.code + " " + c.desc).toLowerCase().includes(q));
      const host = document.querySelector(".course-grid") || document.querySelector(".empty");
      if (host) {
        if (list.length) host.outerHTML = `<div class="course-grid" style="margin-top:8px">${list.map(courseCardHTML).join("")}</div>`;
        else host.outerHTML = `<div class="empty">No courses match those filters.</div>`;
      }
    });
  }

  document.querySelectorAll(".chip[data-f]").forEach((chip) => {
    chip.addEventListener("click", () => {
      const p = new URLSearchParams(location.hash.split("?")[1] || "");
      const f = chip.dataset.f, v = chip.dataset.v;
      v === "all" ? p.delete(f) : p.set(f, v);
      location.hash = "#/catalog?" + p.toString();
    });
  });

  const npcForm = document.getElementById("npcForm");
  if (npcForm) {
    const recalc = () => {
      const level = document.getElementById("npcLevel").value;
      const dep = document.getElementById("npcDep").value;
      const band = document.getElementById("npcBand").value;
      const credits = Math.max(3, Math.min(36, parseInt(document.getElementById("npcCredits").value, 10) || 24));
      const perCr = level === "grad" ? TUITION.gradPerCredit : TUITION.ugPerCredit;
      const terms = credits > 18 ? 2 : 1;
      const tuition = credits * perCr;
      const fees = TUITION.techFeeTerm * terms;
      const directCost = tuition + fees;
      let grant = 0;
      if (level === "ug") {
        const base = { a: 6800, b: 4200, c: 1800, d: 600, e: 0 }[band] || 0;
        grant = base + (dep === "ind" ? 500 : 0);
        grant = Math.min(grant, tuition);
        grant = Math.round(grant * (credits / 24));
      }
      const net = Math.max(0, directCost - grant);
      const out = document.getElementById("npcOut");
      out.innerHTML = `
        <div class="row"><span>Estimated tuition (${credits} credits / year)</span><span class="num">${usd(tuition)}</span></div>
        <div class="row"><span>Technology fee (${terms} term${terms > 1 ? "s" : ""})</span><span class="num">${usd(fees)}</span></div>
        <div class="row"><span>Books &amp; required materials</span><span class="num">$0</span></div>
        <div class="row"><span>Estimated grant &amp; scholarship aid${level === "grad" ? " (n/a at graduate level)" : ""}</span><span class="num">${grant ? "− " + usd(grant) : "$0"}</span></div>
        <div class="row net"><span>Estimated net price / year</span><span class="num">${usd(net)}</span></div>
        <p style="font-size:var(--step--2);color:var(--ink-faint);font-family:var(--font-mono);margin-top:12px;line-height:1.6">Illustrative estimate only. Excludes living expenses (est. ${usd(TUITION.livingIndirectYear)}/yr indirect for full-time students). Grant figures are placeholders pending Title IV certification and do not represent an aid offer. A real Net Price Calculator uses the prior year's actual awarded aid by income and enrollment.</p>`;
    };
    npcForm.addEventListener("input", recalc);
    npcForm.addEventListener("change", recalc);
    recalc();
  }
}

window.addEventListener("hashchange", render);
if (!location.hash) location.hash = "#/";
render();
</script>
</body>
</html>
